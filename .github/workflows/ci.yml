name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Critères requis seulement pour le store HACS par défaut,
          # pas pour une installation en dépôt personnalisé.
          ignore: brands description topics license

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_lint.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Version actuelle de Home Assistant
          - name: actuelle
            python: "3.14"
            requirements: requirements_test.txt
          # Plus ancienne version prise en charge (hacs.json)
          - name: minimale
            python: "3.13"
            requirements: tests/requirements_min.txt
    name: tests (HA ${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r ${{ matrix.requirements }}
      - name: mypy
        if: matrix.name == 'actuelle'
        run: mypy
      - name: pytest
        shell: bash
        run: |
          set +e
          pytest -rfE --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Résumé des échecs en annotation (lisible sans télécharger les logs)
            msg=$(grep -E "^(FAILED|ERROR)|Error|assert" pytest.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=pytest::${msg}"
          fi
          exit $status
