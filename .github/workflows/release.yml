name: Release

# Publie le tag et la release GitHub quand la CI réussit sur main et que la
# version du manifeste n'a pas encore de release. HACS propose alors la mise
# à jour avec son numéro de version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Jamais de release sur une CI en échec
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Lire la version
        id: version
        run: echo "version=$(jq -r .version custom_components/lumina/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publier la release si elle n'existe pas
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà."
            exit 0
          fi
          # Notes : la section du CHANGELOG correspondant à la version
          awk -v v="$VERSION" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n**Mise à jour :** HACS → Lumina → Mettre à jour, puis redémarrer Home Assistant.\n' >> notes.md
          gh release create "v$VERSION" --target "$TARGET" --title "Lumina $VERSION" --notes-file notes.md
